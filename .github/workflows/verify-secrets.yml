# ==========================================================================
# فحص الأسرار الثمانية — بلا بناء وبلا رفع
# --------------------------------------------------------------------------
# أسرار GitHub لا تُقرأ بعد حفظها، لا أنت ولا أحد. فالطريقة الوحيدة للتأكد
# أنها لُصقت صحيحة أن يستعملها جهاز ماك فعلاً.
#
# هذا السير يفعل ذلك في دقيقتين بدل خمس عشرة: يفكّ الشهادة بكلمة مرورها،
# ويستوردها في سلسلة مفاتيح مؤقتة، ويفكّ ملف التزويد، ويتأكد أن الشهادة
# التي بداخله هي نفسها المرفوعة، ويقرأ مفتاح الـAPI.
#
# لا يطبع قيمة أي سرّ — فقط ما يُشتقّ منها (اسم الهوية، تاريخ الانتهاء).
# ==========================================================================

name: فحص الأسرار

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: فحص الأسرار الثمانية
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          FAIL=0
          OSSL=/usr/bin/openssl

          echo "=== 1. وجود الأسرار الثمانية ==="
          for v in CERT_B64 P12_PASSWORD PROFILE_B64 KEYCHAIN_PASSWORD ISSUER KEY_ID PRIVATE_KEY TEAM_ID; do
            if [ -z "${!v}" ]; then echo "  ناقص: $v"; FAIL=1; else echo "  موجود: $v"; fi
          done
          if [ "$FAIL" = "1" ]; then echo "سرّ ناقص — أضفه ثم أعد التشغيل."; exit 1; fi

          echo ""
          echo "=== 2. الشهادة: الترميز وكلمة المرور ==="
          printf '%s' "$CERT_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "  الحجم بعد فكّ الترميز: $(wc -c < $RUNNER_TEMP/cert.p12) بايت"
          if [ ! -s $RUNNER_TEMP/cert.p12 ]; then echo "  الملف فارغ — أعد لصق BUILD_CERTIFICATE_BASE64"; exit 1; fi
          KEYCHAIN=$RUNNER_TEMP/verify.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          if security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -f pkcs12 -k $KEYCHAIN -T /usr/bin/codesign; then
            echo "  الاستيراد نجح — إذاً P12_PASSWORD صحيحة والملف سليم"
          else
            echo "  فشل الاستيراد — إمّا P12_PASSWORD خاطئة أو الترميز ناقص"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN > /dev/null 2>&1 || true
          security list-keychain -d user -s $KEYCHAIN

          echo ""
          echo "=== 3. هوية التوقيع ==="
          security find-identity -v -p codesigning $KEYCHAIN || true
          if security find-identity -v -p codesigning $KEYCHAIN | grep -q "Apple Distribution"; then
            echo "  هوية Apple Distribution موجودة"
          else
            echo "  لا توجد هوية Apple Distribution — الشهادة ربما Development لا Distribution"
            FAIL=1
          fi

          echo ""
          echo "=== 4. ملف التزويد ==="
          printf '%s' "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/p.mobileprovision
          if [ ! -s $RUNNER_TEMP/p.mobileprovision ]; then echo "  الملف فارغ — أعد لصق PROVISIONING_PROFILE_BASE64"; exit 1; fi
          security cms -D -i $RUNNER_TEMP/p.mobileprovision > $RUNNER_TEMP/p.plist
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/p.plist)
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $RUNNER_TEMP/p.plist)
          EXPIRY=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" $RUNNER_TEMP/p.plist)
          PTEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $RUNNER_TEMP/p.plist)
          GTA=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" $RUNNER_TEMP/p.plist)
          echo "  الاسم:   $NAME"
          echo "  المعرّف: $APPID"
          echo "  ينتهي:   $EXPIRY"
          case "$APPID" in
            *com.rajaxdx.huroof) echo "  يطابق معرّف التطبيق" ;;
            *) echo "  لا يطابق com.rajaxdx.huroof"; FAIL=1 ;;
          esac
          if [ "$GTA" = "false" ]; then echo "  get-task-allow = false (صحيح للتوزيع)"; else echo "  get-task-allow ليس false — هذا ملف تطوير لا توزيع"; FAIL=1; fi

          echo ""
          echo "=== 5. TEAM_ID مقابل ملف التزويد ==="
          if [ "$PTEAM" = "$TEAM_ID" ]; then echo "  متطابق"; else echo "  TEAM_ID لا يطابق الفريق داخل الملف"; FAIL=1; fi

          echo ""
          echo "=== 6. الشهادة داخل ملف التزويد هي نفسها المرفوعة ==="
          plutil -extract DeveloperCertificates.0 raw -o - $RUNNER_TEMP/p.plist | base64 --decode > $RUNNER_TEMP/emb.der
          $OSSL pkcs12 -in $RUNNER_TEMP/cert.p12 -passin pass:"$P12_PASSWORD" -nokeys -clcerts 2>/dev/null | $OSSL x509 -outform DER > $RUNNER_TEMP/mine.der
          EMB=$(shasum -a 256 $RUNNER_TEMP/emb.der | cut -d " " -f 1)
          MINE=$(shasum -a 256 $RUNNER_TEMP/mine.der | cut -d " " -f 1)
          if [ -n "$EMB" ] && [ "$EMB" = "$MINE" ]; then
            echo "  متطابقة — الشهادة وملف التزويد زوج صحيح"
          else
            echo "  غير متطابقة — ملف التزويد أُنشئ بشهادة أخرى، والتوقيع سيفشل"
            FAIL=1
          fi

          echo ""
          echo "=== 7. مفتاح الـAPI ==="
          printf '%s' "$PRIVATE_KEY" > $RUNNER_TEMP/key.p8
          if $OSSL pkey -in $RUNNER_TEMP/key.p8 -noout 2>/dev/null; then
            echo "  المفتاح يُقرأ ويصلح"
          else
            echo "  APPSTORE_PRIVATE_KEY غير مقروء — لُصق ناقصاً أو بلا سطري BEGIN و END"
            FAIL=1
          fi
          echo "  طول APPSTORE_KEY_ID: ${#KEY_ID} (المتوقع 10)"
          echo "  طول APPSTORE_ISSUER_ID: ${#ISSUER} (المتوقع 36)"
          [ ${#KEY_ID} -eq 10 ] || { echo "  طول KEY_ID غير متوقع"; FAIL=1; }
          [ ${#ISSUER} -eq 36 ] || { echo "  طول ISSUER_ID غير متوقع"; FAIL=1; }

          echo ""
          echo "=== النتيجة ==="
          if [ "$FAIL" = "0" ]; then
            echo "  الأسرار الثمانية كلها سليمة. شغّل سير iOS بـ upload = true."
          else
            echo "  سرّ واحد أو أكثر غير سليم — راجع الأسطر أعلاه."
            exit 1
          fi

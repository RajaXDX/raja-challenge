# ==========================================================================
# بناء تطبيق «تحدي رجا» لـiOS ورفعه إلى App Store Connect
# --------------------------------------------------------------------------
# صاحب المشروع يعمل على ويندوز، و Xcode حصري لـ macOS. هذا السير يستأجر
# جهاز ماك من GitHub (مجاني للمستودعات العامة) فيبني ويوقّع ويرفع.
#
# قبل أول تشغيل يجب إضافة الأسرار في:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   BUILD_CERTIFICATE_BASE64   شهادة التوزيع .p12 مُرمّزة base64
#   P12_PASSWORD               كلمة مرور ملف .p12
#   PROVISIONING_PROFILE_BASE64  ملف .mobileprovision مُرمّزاً base64
#   KEYCHAIN_PASSWORD          أي كلمة تخترعها لسلسلة المفاتيح المؤقتة
#   APPSTORE_ISSUER_ID         من App Store Connect → Users and Access → Keys
#   APPSTORE_KEY_ID            المعرّف نفسه
#   APPSTORE_PRIVATE_KEY       محتوى ملف .p8 كاملاً
#   TEAM_ID                    من developer.apple.com → Membership
#
# التفاصيل خطوة بخطوة في APPSTORE.md
# ==========================================================================

name: iOS

on:
  workflow_dispatch:          # يُشغَّل يدوياً من تبويب Actions
    inputs:
      upload:
        description: 'ارفع إلى App Store Connect بعد البناء'
        type: boolean
        default: false

jobs:
  build:
    # صورة ماك من GitHub. الدقيقة تُحتسب مضاعفة على المستودعات الخاصة،
    # ومجانية بلا حدّ على العامة.
    #
    # macos-26 لا macos-15: آبل ترفض منذ 2026 أي حزمة بُنيت بـSDK أقدم من
    # iOS 26، وصورة macos-15 تأتي بـXcode 16 (SDK 18.5). البناء والتوقيع
    # والتصدير كلها كانت تنجح ثم يردّ الرفع بـ409 في آخر خطوة.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: اختيار أحدث Xcode والتحقّق من الـSDK
        run: |
          # الصورة تحمل أكثر من إصدار، والافتراضي ليس أحدثها بالضرورة.
          # نختار الأحدث ونتأكد من رقم الـSDK هنا — قبل عشر دقائق بناء —
          # بدل أن نكتشفه في ردّ 409 من آبل بعد نجاح كل شيء.
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "المتاح:"; ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | sed 's/iphoneos//' | sort -V | tail -1)
          echo "أحدث SDK لـiOS: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "آبل تشترط SDK 26 فأحدث. المتاح $SDK — تحتاج صورة ماك أحدث في runs-on."
            exit 1
          fi

      - name: تثبيت اعتماديات Node
        run: npm ci

      - name: تجميع ملفات اللعبة في www
        run: python3 tools/build-www.py

      - name: مزامنة Capacitor مع مشروع iOS
        run: npx cap sync ios

      # ------------------------------------------------------------------
      # بلا أسرار نبني بلا توقيع: يثبت أن الكود يُترجم ويكتشف الأعطال مبكراً
      # دون الحاجة إلى حساب مطوّر. هذا ما يعمل قبل أن تدفع الـ99 دولاراً.
      # ------------------------------------------------------------------
      - name: بناء بلا توقيع (فحص الترجمة)
        if: ${{ !inputs.upload }}
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ------------------------------------------------------------------
      # المسار الموقَّع: يحتاج كل الأسرار أعلاه
      # ------------------------------------------------------------------
      - name: تركيب الشهادة وملف التزويد
        if: ${{ inputs.upload }}
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db

          printf %s "$CERT_B64" | base64 --decode > $CERT_PATH
          printf %s "$PROFILE_B64" | base64 --decode > $PROFILE_PATH

          # سلسلة مفاتيح مؤقتة تموت مع الجهاز الافتراضي بعد انتهاء التشغيل
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          # بلا -t: الملف يحمل الشهادة والمفتاح معاً، وحصره في cert
          # يترك المفتاح خارج السلسلة أحياناً فيفشل التوقيع لاحقاً.
          # و-T تمنح codesign وsecurity حق استعماله بلا نافذة إذن.
          security import $CERT_PATH -P "$P12_PASSWORD" -A \
            -f pkcs12 -k $KEYCHAIN \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN

          # Xcode يبحث عن ملف التزويد باسم الـUUID، وفي مجلدين
          # مختلفين حسب الإصدار. ننسخه للاثنين باسمه الصحيح بدل
          # الرهان على أحدهما.
          security cms -D -i $PROFILE_PATH > $RUNNER_TEMP/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' $RUNNER_TEMP/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' $RUNNER_TEMP/profile.plist)

          for d in ~/Library/MobileDevice/Provisioning\ Profiles \
                   ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$d"
            cp $PROFILE_PATH "$d/$UUID.mobileprovision"
          done

          # اسم الملف يُقرأ من الملف نفسه ولا يُكتب هنا يدوياً،
          # فتغييره في حساب آبل لا يكسر السير.
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV
          echo "ملف التزويد: $NAME ($UUID)"

          # اسم الملف مكتوب في إعدادات هدف App داخل مشروع Xcode،
          # فلا يمكن تمريره على سطر الأوامر (يطال أهداف Pods فتفشل).
          # نتأكد أن المنزَّل هو المتوقَّع بدل أن نكتشفه في فشل توقيع.
          EXPECTED=$(grep -m1 PROVISIONING_PROFILE_SPECIFIER ios/App/App.xcodeproj/project.pbxproj | sed -e "s/.*= //" -e "s/;//" -e "s/\"//g")
          if [ "$NAME" != "$EXPECTED" ]; then
            echo "اسم ملف التزويد ($NAME) لا يطابق ما في مشروع Xcode ($EXPECTED)"
            echo "غيّر PROVISIONING_PROFILE_SPECIFIER في project.pbxproj أو أعد إنشاء الملف بالاسم نفسه."
            exit 1
          fi
          echo "الاسم يطابق مشروع Xcode"

      - name: أرشفة التطبيق
        if: ${{ inputs.upload }}
        run: |
          # لا تُمرَّر إعدادات توقيع هنا. أي إعداد على سطر أوامر xcodebuild
          # يُطبَّق على كل هدف في مساحة العمل — ومنها أهداف Pods، وهي أطر لا
          # تقبل ملف تزويد، فتفشل الأرشفة بـ"does not support provisioning
          # profiles" لكل واحد منها. التوقيع مكتوب في إعدادات هدف App وحده
          # داخل project.pbxproj.
          #
          # ورقم البناء يُمرَّر هنا لأنه غير ضارّ بالأهداف الأخرى: App Store
          # Connect يرفض رقماً استُعمل من قبل، ورقم تشغيل السير يتزايد أبداً.
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: تصدير ملف ipa
        if: ${{ inputs.upload }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.rajaxdx.tahadiraja</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: الرفع إلى App Store Connect
        if: ${{ inputs.upload }}
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$PRIVATE_KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/export/*.ipa \
            -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: حفظ الناتج
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
